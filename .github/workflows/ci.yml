name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0
      - run: npm ci --ignore-scripts && npm test && npm run build
        working-directory: web
      - run: go test -race ./...
      - run: go vet ./...
      - run: helm lint charts/kubeshelf --set demo=true --set publicURL=http://localhost:8080
      - run: helm template kubeshelf charts/kubeshelf --values examples/values.yaml > /tmp/kubeshelf-rendered.yaml
